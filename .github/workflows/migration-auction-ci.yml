name: Migration Auction CI

on:
  push:
    branches:
      - main
      - migration-auction-kotlin
    paths:
      - "migration-auction/**"
      - ".github/workflows/migration-auction-ci.yml"
  pull_request:
    paths:
      - "migration-auction/**"
      - ".github/workflows/migration-auction-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build migration-auction
        run: |
          chmod +x gradlew
          ./gradlew -p migration-auction clean build
