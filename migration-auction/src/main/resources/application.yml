spring:
  application:
    name: migration-auction
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:h2:mem:migration_auction;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS auction
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  ai:
    openai:
      api-key: dummy
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: migration-auction
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: "*"
    listener:
      missing-topics-fatal: false

eureka:
  client:
    enabled: false

server:
  port: 18081
